name: build bundles

# Builds one embedded-PostgreSQL bundle per platform -- zonky's Postgres tree with
# pgvector compiled into it -- and publishes them as a release.
#
# No PAT: the release is created in this repository, so the automatic GITHUB_TOKEN
# suffices. The `permissions:` block below grants it write access even when the org
# default for new workflows is read-only.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (otherwise build + verify only)"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-universal, os: macos-14,          container: '' }
          # ⚠ THE LINUX BUNDLES BUILD IN AN OLD CONTAINER, AND THAT IS THE WHOLE POINT.
          # We compile exactly one file into a bundle everyone else's binaries come
          # prebuilt in — so this runner's glibc is the only build-machine detail that can
          # leak into the artifact, and on ubuntu-24.04 (glibc 2.39) it did: r3's vector.so
          # demanded GLIBC_2.38 (one symbol, __isoc23_strtol) while zonky's own postgres
          # needs 2.25. The bundle then died at CREATE EXTENSION on Debian 12 and Ubuntu
          # 22.04 — two of the commonest Linux installs there are.
          # bullseye is glibc 2.31 and PGDG publishes postgresql-server-dev-17 for it;
          # measured, the same source then needs only GLIBC_2.14. build-bundle.sh refuses
          # to pack a module that needs more than the server it loads into, so this pin and
          # that check hold the property from both ends.
          - { rid: linux-x64,     os: ubuntu-24.04,      container: 'debian:bullseye-slim' }
          - { rid: linux-arm64,   os: ubuntu-24.04-arm,  container: 'debian:bullseye-slim' }
          - { rid: win-x64,       os: windows-latest,    container: '' }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # FIRST, before checkout: a slim container has no git, and actions/checkout silently
      # falls back to a tarball download without it — which works, but leaves the build
      # depending on a fallback nobody chose.
      - name: Install build prerequisites (Linux container)
        if: runner.os == 'Linux'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg lsb-release git make gcc binutils unzip xz-utils

      - uses: actions/checkout@v7

      - name: Install PostgreSQL 17 server headers (macOS)
        if: runner.os == 'macOS'
        run: brew install postgresql@17

      # Windows needs the MSVC/nmake build (build-bundle.ps1). A full PostgreSQL 17
      # install supplies the headers, import libs and psql the build needs; the runner
      # already has the MSVC toolchain (vcvars64).
      - name: Install PostgreSQL 17 (Windows)
        if: runner.os == 'Windows'
        run: choco install postgresql17 --no-progress -y --params '/Password:postgres'

      # PGDG publishes PostgreSQL 17 for bullseye as well as for noble, which is what makes
      # the old-container pin above possible at all. No sudo: a container job runs as root
      # and slim images do not ship sudo.
      - name: Install PostgreSQL 17 server headers (Linux)
        if: runner.os == 'Linux'
        run: |
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list
          apt-get update -qq
          apt-get install -y -qq postgresql-server-dev-17 postgresql-client-17

      # Both build scripts refuse to pack a bundle they could not load: they start the
      # bundle's OWN server, do CREATE EXTENSION vector into template1, and check an hnsw
      # nearest-neighbour scan returns the right row. A broken bundle fails here, not on a
      # user's laptop.
      - name: Build and verify (unix)
        if: runner.os != 'Windows'
        run: |
          # ⚠ A CONTAINER JOB RUNS AS ROOT, AND initdb REFUSES TO RUN AS ROOT. The verification
          # above is not a formality — it starts the bundle's OWN server — so the build itself
          # has to be an ordinary user. macOS runs as `runner` already and takes the else branch.
          if [ "$(id -u)" = "0" ]; then
            useradd -m builder
            chown -R builder .
            runuser -u builder -- ./build-bundle.sh ${{ matrix.rid }}
          else
            ./build-bundle.sh ${{ matrix.rid }}
          fi

      - name: Build and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build-bundle.ps1 -PgRoot 'C:\Program Files\PostgreSQL\17'

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0   # already gzipped tarballs; re-zipping only burns CI time

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source versions.env
          TAG="pg${PG_VERSION}-pgvector${PGVECTOR_VERSION}-r${BUNDLE_REVISION}"

          # Immutable by construction. Consumers pin the SHA-256 of these exact bytes,
          # so an existing tag is an error, never a silent overwrite -- bump
          # BUNDLE_REVISION instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; bump BUNDLE_REVISION in versions.env." >&2
            exit 1
          fi

          gh release create "$TAG" \
            --title "PostgreSQL ${PG_VERSION} + pgvector ${PGVECTOR_VERSION}" \
            --notes "Embedded PostgreSQL bundles with pgvector built in.

          Each bundle is verified before publish: the bundle's own server must \`CREATE EXTENSION vector\`
          and return a correct hnsw nearest-neighbour result.

          PostgreSQL binaries are repackaged from [zonky](https://github.com/zonkyio/embedded-postgres-binaries),
          unmodified except that the macOS tree's LGPL libs are removed (libintl deleted; libxml2 repointed to the
          system libiconv), so no bundle redistributes LGPL-licensed code.
          Licence texts for every redistributed component ship inside each bundle under \`LICENSES/\`;
          see \`THIRD-PARTY-NOTICES.md\`.

          Verify a download with the matching \`.sha256\` file." \
            dist/*

          echo "### Published \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/*.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
